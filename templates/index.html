<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keystroke Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Keystroke Tracker</h1>
      <p>Web UI powered by Flask</p>
    </header>

    <section class="status-card">
      <div>
        <span class="status-label">Total Keystrokes</span>
        <strong id="count">0</strong>
      </div>
      <div>
        <span class="status-label">Session Time</span>
        <strong id="duration">00:00:00</strong>
      </div>
      <div>
        <span class="status-label">Top 3 Keys</span>
        <strong id="topKeys">None</strong>
      </div>
    </section>

    <section class="chart-card">
      <div class="chart-header">
        <h2>Top 3 Keys Visualization</h2>
        <div class="chart-toggle">
          <button id="barChartBtn" class="chart-btn active" onclick="switchChart('bar')">Bar Chart</button>
          <button id="pieChartBtn" class="chart-btn" onclick="switchChart('pie')">Pie Chart</button>
        </div>
      </div>
      <canvas id="topKeysChart" width="400" height="200"></canvas>
    </section>

    <section class="controls">
      <button id="startButton" class="btn btn-primary" onclick="startTracking()">Start</button>
      <button id="stopButton" class="btn btn-secondary" onclick="stopTracking()" disabled>Stop</button>
    </section>

    <section class="history-card">
      <h2>Session History</h2>
      <table id="historyTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Date / Time</th>
            <th>Duration</th>
            <th>Keystrokes</th>
            <th>Top 3 Keys</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </div>

  <script>
    let topKeysChart;
    let currentChartType = 'bar';
    let tracking = false;

    function initChart(chartType = 'bar') {
      const ctx = document.getElementById('topKeysChart').getContext('2d');

      const commonData = {
        labels: [],
        datasets: [{
          label: 'Key Press Count',
          data: [],
          backgroundColor: [
            'rgba(255, 99, 132, 0.6)',
            'rgba(54, 162, 235, 0.6)',
            'rgba(255, 205, 86, 0.6)'
          ],
          borderColor: [
            'rgba(255, 99, 132, 1)',
            'rgba(54, 162, 235, 1)',
            'rgba(255, 205, 86, 1)'
          ],
          borderWidth: 1
        }]
      };

      const config = chartType === 'pie'
        ? {
            type: 'pie',
            data: commonData,
            options: {
              responsive: true,
              plugins: { legend: { position: 'right' } }
            }
          }
        : {
            type: 'bar',
            data: commonData,
            options: {
              responsive: true,
              scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
              plugins: { legend: { display: false } }
            }
          };

      topKeysChart = new Chart(ctx, config);
    }

    function switchChart(chartType) {
      currentChartType = chartType;
      document.getElementById('barChartBtn').classList.toggle('active', chartType === 'bar');
      document.getElementById('pieChartBtn').classList.toggle('active', chartType === 'pie');
      if (topKeysChart) topKeysChart.destroy();
      initChart(chartType);
      fetchStatus();
    }

    function updateChart(topKeysData) {
      if (!topKeysChart) initChart(currentChartType);
      topKeysChart.data.labels = topKeysData.map(item => item.key || 'None');
      topKeysChart.data.datasets[0].data = topKeysData.map(item => item.count || 0);
      topKeysChart.update();
    }

    function updateUI(status) {
      document.getElementById('count').textContent = status.count;
      document.getElementById('duration').textContent = status.duration;
      document.getElementById('topKeys').textContent = status.top_keys;
      document.getElementById('startButton').disabled = status.running;
      document.getElementById('stopButton').disabled = !status.running;
      tracking = status.running;
      updateChart(status.top_keys_data || []);
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error(res.status);
        updateUI(await res.json());
      } catch (e) {
        console.warn('Status fetch failed:', e);
      }
    }

    async function fetchHistory() {
      try {
        const res = await fetch('/api/history');
        if (!res.ok) throw new Error(res.status);
        const sessions = await res.json();
        const tbody = document.querySelector('#historyTable tbody');
        tbody.innerHTML = '';
        sessions.forEach((session, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${session.time}</td>
            <td>${session.duration}</td>
            <td>${session.keystrokes}</td>
            <td>${session.top_keys}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (e) {
        console.warn('History fetch failed:', e);
      }
    }

    async function sendKey(key) {
      try {
        await fetch('/api/keypress', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key })
        });
      } catch (e) {
        console.warn('Keypress send failed:', e);
      }
    }

    document.addEventListener('keydown', async (event) => {
      if (!tracking) return;
      await sendKey(event.key);
      await fetchStatus();
    });

    async function startTracking() {
      try {
        const res = await fetch('/api/start', { method: 'POST' });
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        if (data.success && data.status) updateUI(data.status);
      } catch (e) {
        console.warn('Start failed:', e);
      }
    }

    async function stopTracking() {
      try {
        const res = await fetch('/api/stop', { method: 'POST' });
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        if (data.success && data.status) {
          updateUI(data.status);
          await fetchHistory();
        }
      } catch (e) {
        console.warn('Stop failed:', e);
      }
    }

    setInterval(fetchStatus, 1000);
    setInterval(fetchHistory, 5000);
    initChart();
    fetchStatus();
    fetchHistory();
  </script>
</body>
</html>
